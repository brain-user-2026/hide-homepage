<!doctype html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root {
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --blue: #2563EB;
      --blue-dark: #1D4ED8;
      --blue-soft: #DBEAFE;
      --text: #0F172A;
      --muted: #64748B;
      --line: #CBD5E1;
    }

    html,
    body {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Yu Gothic", Meiryo, sans-serif;
    }

    .page {
      width: 100%;
      padding: 14px;
      padding-bottom: 96px;
    }

    .hero {
      background: var(--blue);
      color: #fff;
      padding: 28px 20px;
      border-radius: 0 0 26px 26px;
      margin: -14px -14px 18px;
    }

    .hero h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 900;
    }

    .hero p {
      margin: 8px 0 0;
      font-size: 16px;
      font-weight: 700;
    }

    .card {
      width: 100%;
      background: var(--card);
      border: 1px solid #E2E8F0;
      border-radius: 22px;
      padding: 22px;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
    }

    form {
      display: grid;
      gap: 20px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    label {
      display: grid;
      gap: 8px;
      font-size: 17px;
      font-weight: 900;
    }

    input,
    select,
    textarea,
    button {
      width: 100%;
      font: inherit;
      border-radius: 16px;
    }

    input,
    select,
    textarea {
      min-height: 64px;
      padding: 16px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      font-size: 18px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 3px solid var(--blue-soft);
      border-color: var(--blue);
    }

    .quick-title {
      margin: 0;
      font-size: 16px;
      font-weight: 900;
    }

    .quick-categories {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .quick-category {
      min-height: 56px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--blue);
      font-size: 16px;
      font-weight: 900;
    }

    .quick-category.is-selected {
      background: var(--blue-soft);
      border-color: var(--blue);
    }

    .details {
      display: none;
      gap: 20px;
    }

    .details.is-open {
      display: grid;
    }

    .link-button {
      min-height: 44px;
      border: 0;
      background: transparent;
      color: var(--blue);
      text-align: left;
      font-size: 16px;
      font-weight: 900;
    }

    .receipt-box {
      display: grid;
      gap: 10px;
      padding: 18px;
      border: 2px dashed var(--line);
      border-radius: 20px;
      background: #F8FAFC;
    }

    .receipt-title {
      font-size: 16px;
      font-weight: 900;
    }

    .receipt-button {
      min-height: 60px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--blue);
      font-size: 17px;
      font-weight: 900;
    }

    .receipt-file {
      display: none;
    }

    .receipt-name {
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      word-break: break-all;
    }

    .save-button {
      min-height: 68px;
      border: 0;
      background: var(--blue);
      color: #fff;
      font-size: 20px;
      font-weight: 900;
    }

    .save-button:hover {
      background: var(--blue-dark);
    }

    .save-button:disabled {
      opacity: 0.65;
    }

    #status {
      min-height: 24px;
      color: var(--blue);
      font-size: 15px;
      font-weight: 900;
      text-align: center;
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
      background: #fff;
      border-top: 1px solid #E2E8F0;
    }

    .nav-item {
      min-height: 46px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .nav-item.is-active,
    .nav-add {
      color: var(--blue);
    }

    @media screen and (min-width: 769px) {
      .page {
        max-width: 680px;
        margin: 24px auto;
        padding-bottom: 24px;
      }

      .hero {
        margin: 0 0 18px;
        border-radius: 26px;
      }

      .bottom-nav {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="hero">
      <h1>家計簿入力</h1>
      <p>毎日の支出をかんたん記録</p>
    </header>

    <main class="card">
      <form id="form">
        <div class="grid-2">
          <label>
            日付
            <input name="date" type="date" required>
          </label>

          <label>
            種別
            <select name="type" required>
              <option value="支出">支出</option>
              <option value="収入">収入</option>
            </select>
          </label>
        </div>

        <p class="quick-title">クイックカテゴリー</p>
        <div class="quick-categories" id="quickCategories">
          <button class="quick-category" type="button" data-category="食費">食費</button>
          <button class="quick-category" type="button" data-category="ガソリン">ガソリン</button>
          <button class="quick-category" type="button" data-category="交通費">交通費</button>
          <button class="quick-category" type="button" data-category="日用品">日用品</button>
          <button class="quick-category" type="button" data-category="その他">その他</button>
        </div>

        <label>
          カテゴリー
          <input id="categoryInput" name="category" list="categoryList" autocomplete="off" placeholder="例: ガソリン">
          <datalist id="categoryList"></datalist>
        </label>

        <label>
          店名
          <input id="storeInput" name="store" list="storeList" autocomplete="off" placeholder="例: ENEOS">
          <datalist id="storeList"></datalist>
        </label>

        <label>
          金額
          <input name="amount" type="number" min="1" inputmode="numeric" required placeholder="例: 5000">
        </label>

        <button id="detailsToggle" class="link-button" type="button">詳細を追加（内容・メモなど）</button>

        <div id="details" class="details">
          <label>
            内容
            <input id="descriptionInput" name="description" placeholder="例: 給油">
          </label>

          <label>
            メモ
            <textarea name="memo" placeholder="必要に応じて入力"></textarea>
          </label>
        </div>

        <div id="receiptBox" class="receipt-box">
          <div class="receipt-title">レシート画像</div>
          <input id="receiptInput" class="receipt-file" type="file" accept="image/*" capture="environment">
          <button id="receiptButton" class="receipt-button" type="button">タップして撮影 / 画像を選択</button>
          <div id="receiptName" class="receipt-name">未選択</div>
        </div>

        <button id="saveButton" class="save-button" type="submit">保存する</button>
        <div id="status" aria-live="polite"></div>
      </form>
    </main>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item is-active" type="button">入力</button>
    <button class="nav-item" type="button">履歴</button>
    <button class="nav-item nav-add" type="button">追加</button>
    <button class="nav-item" type="button">集計</button>
    <button class="nav-item" type="button">設定</button>
  </nav>

  <script>
    const form = document.getElementById('form');
    const statusEl = document.getElementById('status');
    const saveButton = document.getElementById('saveButton');
    const categoryInput = document.getElementById('categoryInput');
    const storeInput = document.getElementById('storeInput');
    const descriptionInput = document.getElementById('descriptionInput');
    const quickButtons = document.querySelectorAll('.quick-category');
    const details = document.getElementById('details');
    const detailsToggle = document.getElementById('detailsToggle');
    const receiptBox = document.getElementById('receiptBox');
    const receiptInput = document.getElementById('receiptInput');
    const receiptButton = document.getElementById('receiptButton');
    const receiptName = document.getElementById('receiptName');

    let storeHints = {};
    let categoryTouched = false;
    let descriptionTouched = false;
    let selectedReceipt = null;

    function setStatus(message) {
      statusEl.textContent = message || '';
    }

    function fillOptions(options) {
      if (!form.date.value) form.date.value = options.today;

      const categoryList = document.getElementById('categoryList');
      const storeList = document.getElementById('storeList');
      categoryList.innerHTML = '';
      storeList.innerHTML = '';

      (options.categories || []).slice(0, 50).forEach(function(item) {
        const option = document.createElement('option');
        option.value = item.name || item;
        categoryList.appendChild(option);
      });

      (options.stores || []).slice(0, 50).forEach(function(name) {
        const option = document.createElement('option');
        option.value = name;
        storeList.appendChild(option);
      });

      storeHints = options.storeHints || {};
    }

    function loadOptions() {
      google.script.run
        .withSuccessHandler(fillOptions)
        .withFailureHandler(function(error) {
          setStatus(error.message || '候補の読み込みに失敗しました。');
        })
        .getInputOptions();
    }

    quickButtons.forEach(function(button) {
      button.addEventListener('click', function() {
        const category = button.dataset.category;

        quickButtons.forEach(function(item) {
          item.classList.remove('is-selected');
        });
        document.querySelectorAll('.quick-category[data-category="' + category + '"]').forEach(function(item) {
          item.classList.add('is-selected');
        });

        categoryTouched = true;
        if (category === 'その他') {
          categoryInput.value = '';
          categoryInput.focus();
          return;
        }
        categoryInput.value = category;
      });
    });

    detailsToggle.addEventListener('click', function() {
      details.classList.toggle('is-open');
    });

    categoryInput.addEventListener('input', function() {
      categoryTouched = true;
    });

    descriptionInput.addEventListener('input', function() {
      descriptionTouched = true;
    });

    storeInput.addEventListener('change', applyStoreHint);
    storeInput.addEventListener('blur', applyStoreHint);

    function applyStoreHint() {
      const store = storeInput.value.trim();
      const hint = storeHints[store];
      if (!hint) return;
      if (!categoryTouched && !categoryInput.value && hint.category) categoryInput.value = hint.category;
      if (!descriptionTouched && !descriptionInput.value && hint.description) descriptionInput.value = hint.description;
    }

    receiptBox.addEventListener('click', function(event) {
      if (event.target === receiptInput) return;
      receiptInput.click();
    });

    receiptButton.addEventListener('click', function(event) {
      event.stopPropagation();
      receiptInput.click();
    });

    receiptInput.addEventListener('change', function() {
      const file = receiptInput.files && receiptInput.files[0];
      if (!file) {
        selectedReceipt = null;
        receiptName.textContent = '未選択';
        return;
      }

      receiptName.textContent = file.name || '画像選択済み';
      const reader = new FileReader();
      reader.onload = function(event) {
        const result = String(event.target.result || '');
        selectedReceipt = {
          name: file.name || 'receipt.jpg',
          mimeType: file.type || 'image/jpeg',
          base64: result.split(',')[1] || ''
        };
      };
      reader.readAsDataURL(file);
    });

    form.addEventListener('submit', function(event) {
      event.preventDefault();

      saveButton.disabled = true;
      setStatus('保存中です...');

      const data = Object.fromEntries(new FormData(form).entries());
      if (selectedReceipt && selectedReceipt.base64) data.receipt = selectedReceipt;

      google.script.run
        .withSuccessHandler(function(result) {
          setStatus(result.message || '保存しました。');

          const keepDate = form.date.value;
          const keepType = form.type.value;
          form.reset();
          form.date.value = keepDate;
          form.type.value = keepType;

          selectedReceipt = null;
          receiptName.textContent = '未選択';
          categoryTouched = false;
          descriptionTouched = false;
          details.classList.remove('is-open');
          quickButtons.forEach(function(item) {
            item.classList.remove('is-selected');
          });

          if (result && result.options) fillOptions(result.options);
          saveButton.disabled = false;
        })
        .withFailureHandler(function(error) {
          setStatus(error.message || '保存に失敗しました。');
          saveButton.disabled = false;
        })
        .saveTransaction(data);
    });

    loadOptions();
  </script>
</body>
</html>
